# Re-reads every site's live count and commits the result.
# No server: GitHub runs the scraper on a schedule, the commit triggers a
# redeploy, and the page is never more than ~20 minutes stale.
name: refresh counts

on:
  schedule:
    - cron: '*/20 * * * *'   # every 20 minutes
  workflow_dispatch:          # and a manual "run now" button

concurrency:
  group: refresh-counts
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright + Chromium
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i -D playwright@latest
          npx playwright install --with-deps chromium

      - name: Read the counts
        run: node scrape-counts.js
        env:
          PLAYWRIGHT_PATH: ./node_modules/playwright

      - name: Commit if anything moved
        run: |
          git config user.name  "counts bot"
          git config user.email "actions@github.com"

          # Never rebase generated files. crowd.js and crowd-history.json are one
          # enormous line of JSON each, so a human push during the ~7 minute
          # scrape used to leave a conflicted rebase — and once attempt 1 was
          # half-done, attempts 2 and 3 could not succeed either. Every run then
          # failed at this step. Instead: keep the fresh output aside, reset hard
          # onto whatever the remote now has, and put the output back.
          mkdir -p /tmp/fresh
          cp crowd.js crowd-history.json /tmp/fresh/
          cp history/*.ndjson /tmp/fresh/ 2>/dev/null || true

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            cp /tmp/fresh/crowd.js /tmp/fresh/crowd-history.json .
            # the log is append-only and the remote may have gained rows while we
            # were scraping, so union the two rather than overwriting
            node merge-history.js /tmp/fresh/*.ndjson

            git add crowd.js crowd-history.json history/
            if git diff --staged --quiet; then
              echo "no change in the numbers"
              exit 0
            fi

            git commit -m "counts: $(date -u '+%Y-%m-%d %H:%M UTC')"
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, someone else committed — starting over from their copy"
            sleep 5
          done
          echo "could not push after 3 attempts"
          exit 1